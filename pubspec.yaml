name: candy_crush_clone
description: Flutter + Flame port of the KorGE Candy Crush clone.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 1.23+ requires Flutter Color.withValues; pin for SDK used by this toolchain.
  flame: ">=1.18.0 <1.22.0"
  flame_audio: ">=2.0.0 <3.0.0"
  audioplayers: ^6.0.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/music/
    - assets/fonts/
